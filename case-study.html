<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case study | Armine</title>
    <link rel="stylesheet" href="case-study.css">
</head>
<body>
    <main class="case-page">
        <a class="back-link" href="index.html#projects">← Назад к проектам</a>
        <section class="case-hero">
            <span id="case-category" class="eyebrow">CASE STUDY</span>
            <h1 id="case-title">Project</h1>
            <p id="case-summary"></p>
            <div id="case-tech" class="tech-list"></div>
            <a id="case-demo" class="demo-link" href="#">Открыть демо <span>↗</span></a>
        </section>

        <section class="case-grid">
            <article class="case-card"><span>01</span><h2>Задача</h2><p id="case-challenge"></p></article>
            <article class="case-card"><span>02</span><h2>Решение</h2><p id="case-solution"></p></article>
            <article class="case-card"><span>03</span><h2>Результат</h2><p id="case-result"></p></article>
        </section>

        <section class="implementation">
            <p class="eyebrow">IMPLEMENTATION</p>
            <h2>Что реализовано</h2>
            <ul id="case-features"></ul>
        </section>
    </main>
    <script src="case-study.js"></script>
</body>
</html>
