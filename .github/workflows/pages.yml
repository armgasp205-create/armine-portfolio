name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-learning/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm --prefix react-learning ci
      - name: Test
        run: npm --prefix react-learning test
      - name: Build React app
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm --prefix react-learning run build -- --base="$PAGES_BASE/react-planner/" --outDir ../.site-dist/react-planner --emptyOutDir
      - name: Include portfolio and CV
        run: node scripts/prepare-static.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
